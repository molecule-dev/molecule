name: Publish (@molecule/*)

# Explicit, dry-run-first publish of every @molecule/* package via changesets.
#
# This is the "big red button": a manually-dispatched (defaults to dry-run) and
# on-tag publish path, complementary to release.yml (the changesets "Version
# Packages" PR automation that auto-publishes on merge to main). Use this to
# validate the publish (dry run) or to publish a tagged release on demand.
#
# AUTH IS OIDC (trusted publishing) — there is no token here. All 910 packages
# were configured 2026-08-05 (scripts/trust-publish-setup.mjs), so `npm publish`
# exchanges the workflow's id-token per package and nothing long-lived is stored.
# That is why `permissions: id-token: write` below is load-bearing, not just for
# provenance: without it npm silently skips OIDC and falls back to an absent
# token, surfacing as a bare ENEEDAUTH.
#
# A real publish happens on a `v*` tag push, or a manual run with `dry_run`
# unchecked. The dry-run path contacts no registry at all.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack + validate only — do NOT publish to the registry'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # required for npm provenance (signed supply-chain attestations)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Writes ~/.npmrc wiring //registry.npmjs.org/:_authToken to
          # ${NODE_AUTH_TOKEN}. Swap this host if D1 picks a different registry.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Dry run (default for manual dispatch): pack every workspace and report the
      # tarball contents. Contacts no registry and needs no token, so it validates
      # the publish surface without any of the D1 prerequisites.
      - name: Publish dry run (pack all @molecule/* — no registry, no token)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --workspaces --access public --dry-run

      # Real publish: on a v* tag, or a manual run with dry_run unchecked.
      #
      # This MUST use the paced publisher, not `changeset publish`. changesets
      # fires every unpublished package at the registry as fast as it can, which
      # on 2026-08-04 got 501 through and then took a sustained E429 on the rest —
      # and npm's limiter is account-wide, clears only after a cooldown with zero
      # attempts, and cannot be lifted on request. A single `v*` tag push would
      # have re-triggered it against the whole fleet.
      #
      # `npm run release` is resumable (it asks the REGISTRY what exists rather
      # than trusting a local list), spaces publishes, and aborts on the first 429
      # instead of grinding. Auth is OIDC via trusted publishing — every package
      # is configured, so no token is referenced here at all.
      - name: Publish @molecule/* (paced, resumable)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true
