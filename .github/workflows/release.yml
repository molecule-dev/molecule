name: Release

on:
  push:
    branches: [main]
  # Manual re-run. The paced publisher is resumable — it asks the REGISTRY what
  # already exists — so re-running after a timeout continues rather than restarts.
  # Publishing ~910 packages takes hours and GitHub kills jobs at 6h, so without
  # this the only way to resume was an empty commit.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max packages to publish this run (npm asks for small batches after a cooldown; blank = all)'
        required: false
        type: string
      delay:
        description: 'Seconds between publishes (default 20)'
        required: false
        type: string

# Push runs supersede each other; a dispatch is NEVER cancelled.
#
# The event_name in the GROUP is what makes that possible. A single shared group
# with cancel-in-progress would mean any push to main kills a publish that is
# already running — and a full fleet publish takes ~3h at delay=20, so a one-line
# doc commit could throw away hours of paced publishing that is deliberately slow
# to stay under npm's rate limiter. Splitting by event keeps the two independent:
# a push only ever cancels an older push, and a dispatch runs undisturbed.
#
# cancel-in-progress is false for dispatches for the same reason — two publish
# runs must queue rather than one killing the other mid-flight. That is safe
# because the publisher is resumable: it asks the registry what already exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance (signed attestations) on the auto-publish path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 still bundles npm
      # 10.x, and without this the CLI silently falls back to looking for a token
      # instead of exchanging the OIDC id-token — which fails as a confusing auth
      # error rather than as "your npm is too old".
      - run: npm install -g npm@latest
      - run: npm --version
      # Build-output cache. scripts/build.js skips a package when its dist is
      # NEWER than its src — an mtime test. A plain restore does NOT help:
      # git checkout stamps sources with the checkout time, so src always looks
      # newer than a restored dist and everything rebuilds regardless.
      #
      # Hashing every source into the KEY is what makes the post-restore touch
      # safe: a hit proves the sources are identical to when dist was built, so
      # declaring dist up-to-date is correct rather than a gamble. Any source
      # change misses the key and produces a genuine full rebuild.
      - uses: actions/cache@v4
        id: build-cache
        with:
          path: packages/**/dist
          key: mol-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'packages/**/package.json', 'packages/**/tsconfig.json') }}
      - name: Mark restored dist newer than src
        if: steps.build-cache.outputs.cache-hit == 'true'
        run: find packages -path '*/dist/*' -exec touch {} +
      - run: npm ci
      - uses: changesets/action@v1
        with:
          # PUBLISHING REQUIRES AN EXPLICIT DISPATCH. A push can open the Version
          # Packages PR but can never publish.
          #
          # Push-triggered runs receive no inputs, so they would publish the ENTIRE
          # fleet with no limit — and GitHub evaluates `vars` when the step RUNS,
          # not when the run starts, so enabling NPM_TRUSTED_PUBLISHING retroactively
          # arms any run already queued. That combination started an unlimited
          # publish twice on 2026-08-04 while batching, both caught by luck rather
          # than design. Requiring workflow_dispatch makes it structurally
          # impossible instead of something a human has to sequence correctly.
          #
          # Publish only when an auth path also exists, via EITHER route:
          #   - vars.NPM_TRUSTED_PUBLISHING == 'true'  → OIDC, no stored secret
          #   - secrets.NPM_TOKEN != ''                → legacy token fallback
          # With `publish` empty changesets still opens/updates the "Version
          # Packages" PR but never contacts the registry.
          #
          # This was once unconditional, and the comment claimed that without a
          # secret the publish step was "a no-op auth failure, so nothing ships".
          # Nothing shipped — but the step exited 1, so EVERY push to main failed
          # this workflow. A job that is expected to be red is indistinguishable
          # from a real regression, which is how it sat unnoticed.
          #
          # Trusted publishing is the target state: set the NPM_TRUSTED_PUBLISHING
          # repo VARIABLE (not a secret) once `npm trust` is configured for the
          # packages, then delete NPM_TOKEN. Nothing long-lived stays at rest.
          #
          # `npm run release` deliberately runs scripts/publish-paced.mjs rather
          # than `changeset publish`. On 2026-08-04 an unpaced publish of the 903
          # package fleet got 501 through and then took a sustained E429 on every
          # remaining package — npm rate-limits publishes, returns no Retry-After,
          # and burns ~70s of internal retries each. The paced publisher spaces
          # them, backs off on 429 instead of failing, treats "already published"
          # as success, and asks the REGISTRY what exists so a re-run resumes
          # rather than restarts. OIDC works unchanged: each `npm publish` does
          # its own token exchange. `changeset publish` is still available as
          # `npm run release:changesets` for a small, normal release.
          publish: ${{ github.event_name == 'workflow_dispatch' && (vars.NPM_TRUSTED_PUBLISHING == 'true' || secrets.NPM_TOKEN != '') && 'npm run release' || '' }}
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Referenced only — never embedded.
          # See molecule-dev/docs/mvp/NPM-PUBLISH-PLAN.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # workflow_dispatch inputs reach the publisher as ENV, not CLI flags:
          # changesets passes the publish string's extra tokens to npm itself.
          MOL_PUBLISH_LIMIT: ${{ inputs.limit }}
          MOL_PUBLISH_DELAY: ${{ inputs.delay }}
