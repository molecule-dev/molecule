name: Release

# ONE DISPATCH DOES EVERYTHING (2026-08-07): version-bump committed straight to
# main, then the paced publish — no "Version Packages" PR, no merge round-trip.
# The PR existed as a review buffer; for this repo it was pure wait-state, and
# the flow was: changeset → push → wait for PR → merge → dispatch → publish.
# Now it is: changeset → push (CI validates) → dispatch once.
#
# What deliberately did NOT change:
#   * A push can never publish. On 2026-08-04 push-triggered publishes started
#     an unlimited fleet publish TWICE, caught by luck. Publishing requires this
#     explicit dispatch, structurally.
#   * The paced publisher (scripts/publish-paced.mjs). npm rate-limits fleet
#     publishes (501 through, then sustained E429 with no Retry-After); it
#     spaces publishes, backs off, treats "already published" as success, and
#     asks the REGISTRY what exists — so a re-dispatch RESUMES, never restarts.
#     That also makes the version→publish pair safe to split across runs: if
#     publish dies, re-dispatch skips versioning (no changesets left) and
#     resumes publishing.
#   * There is no push trigger at all any more. The old push run existed only
#     to open the PR; with the PR gone, a push job would be a no-op — and this
#     workflow's own history (see git log) shows a permanently-red or no-op job
#     is worse than none.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max packages to publish this run (npm asks for small batches after a cooldown; blank = all)'
        required: false
        type: string
      delay:
        description: 'Seconds between publishes (default 20)'
        required: false
        type: string
      trust_otp:
        description: 'npm one-time code. Trusts any package that has none, then publishes it — both in CI. npm has no OIDC path for trust config, so this is the only way to do it without a local prompt. Single-use and expires in ~30s, so it is dead before the log is readable.'
        required: false
        type: string

# Two dispatches queue rather than one killing the other mid-flight — a full
# fleet publish takes ~3h at delay=20, and the publisher is resumable, so
# queueing is always safe and cancellation never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit to main
      id-token: write # npm provenance (signed attestations) + OIDC publish
    steps:
      # ---- 0. Fail BEFORE versioning if nothing could publish ---------------
      # Versioning and then failing auth would leave "bumped on main, nothing on
      # npm" — the half-released state the molecule-release skill exists to dig
      # people out of. Check the auth path first, while the tree is untouched.
      #   - vars.NPM_TRUSTED_PUBLISHING == 'true'  → OIDC, no stored secret
      #   - secrets.NPM_TOKEN != ''                → legacy token fallback
      - name: Assert an npm auth path exists
        env:
          OIDC_ON: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$OIDC_ON" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::No npm auth path: set the NPM_TRUSTED_PUBLISHING repo variable (OIDC) or the NPM_TOKEN secret."
            exit 1
          fi
          echo "auth path: $([ "$OIDC_ON" = "true" ] && echo OIDC || echo token)"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 still bundles npm
      # 10.x, and without this the CLI silently falls back to looking for a token
      # instead of exchanging the OIDC id-token — which fails as a confusing auth
      # error rather than as "your npm is too old".
      - run: npm install -g npm@latest
      - run: npm --version
      # Build-output cache. scripts/build.js skips a package when its dist is
      # NEWER than its src — an mtime test. A plain restore does NOT help:
      # git checkout stamps sources with the checkout time, so src always looks
      # newer than a restored dist and everything rebuilds regardless.
      #
      # Hashing every source into the KEY is what makes the post-restore touch
      # safe: a hit proves the sources are identical to when dist was built, so
      # declaring dist up-to-date is correct rather than a gamble. Any source
      # change misses the key and produces a genuine full rebuild.
      #
      # RESTORE-ONLY, deliberately. Only CI (the job that actually builds every
      # push) may WRITE this cache: a save from here once wrote an EMPTY
      # packages/**/dist under the shared key — every mol-dist-* cache was 0 MB
      # and CI rebuilt all 915 packages every run until it was found.
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            packages/**/dist
            .dist-manifest.json
          key: mol-dist-v2-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'packages/**/package.json', 'packages/**/tsconfig.json') }}
          # Must stay IDENTICAL to ci.yml — the two share this cache so whichever
          # workflow runs first builds and the other restores.
          restore-keys: mol-dist-v2-${{ runner.os }}-
      # Content check, not a blanket touch: only packages whose sources still
      # hash to what produced the restored dist are marked fresh. See
      # scripts/dist-cache-manifest.mjs and the fuller note in ci.yml.
      - name: Reuse dist for packages whose sources are unchanged
        run: node scripts/dist-cache-manifest.mjs --apply
      - run: npm ci

      # ---- 1. Trust any brand-new package, so this same run publishes it ----
      # npm has no OIDC path for trust config — measured, not assumed: in this
      # very workflow `npm trust` answers "401 Bearer token authorization is
      # required" even with setup-node's placeholder credential removed, because
      # the OIDC exchange lives inside `npm publish` and nowhere else. A
      # dispatch-input code is therefore unavoidable; what IS avoidable is doing
      # it locally and then dispatching separately.
      - name: Trust new packages with a supplied code
        if: ${{ inputs.trust_otp != '' }}
        run: node scripts/trust-new-packages.mjs --ci --otp=${{ inputs.trust_otp }}

      # ---- 2. Version: consume changesets, commit STRAIGHT to main ----------
      # `npm run version` = `changeset version` (bumps package.jsons, writes the
      # public CHANGELOG.md files) + a lockfile-only install, so the commit is
      # consistent and the pre-commit lockfile check passes on its merits.
      # The pre-push trust guard detects the hookless terminal and exits 0
      # (scripts/trust-new-packages.mjs — fixed 2026-08-07 after it killed the
      # changesets action's own push from inside this workflow).
      #
      # Skipped when no changesets are pending: that is the RESUME case — a
      # previous run versioned but its publish died; re-dispatching publishes
      # whatever the registry is missing without minting new versions.
      # GITHUB_TOKEN pushes do not trigger other workflows, so this cannot
      # recurse into CI or itself.
      - name: Version packages (skip when resuming)
        run: |
          set -eu
          if ! ls .changeset/*.md 2>/dev/null | grep -v README > /dev/null; then
            echo "No pending changesets — publish-only run (resume)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run version
          # Scoped -A: exactly the three places `changeset version` writes —
          # bumped package.jsons + new/updated CHANGELOG.md files (any depth),
          # the consumed changeset files (deletions), and the lockfile. In this
          # clean runner checkout nothing else can be dirty there.
          git add -A packages .changeset package-lock.json
          git commit -m "chore: version packages"
          # A human (or another agent) may have pushed since checkout; rebase the
          # one version commit on top rather than failing the whole release.
          git pull --rebase origin main
          git push origin HEAD:main

      # ---- 3. Publish (paced, resumable, OIDC) ------------------------------
      # `npm run release` = build + scripts/publish-paced.mjs. OIDC works
      # unchanged: each `npm publish` does its own token exchange.
      - name: Publish
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          # Dispatch inputs reach the publisher as ENV, not CLI flags.
          MOL_PUBLISH_LIMIT: ${{ inputs.limit }}
          MOL_PUBLISH_DELAY: ${{ inputs.delay }}
