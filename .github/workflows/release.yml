name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance (signed attestations) on the auto-publish path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          # Hand changesets a publish command ONLY when a token actually exists.
          # With `publish` empty it still opens/updates the "Version Packages" PR
          # but never contacts the registry.
          #
          # This was unconditional, and the comment below claimed that without the
          # secret the publish step was "a no-op auth failure, so nothing ships".
          # Nothing shipped — but the step exited 1 ("Publish command exited with
          # code 1"), so EVERY push to main failed this workflow. A red job that is
          # expected to be red is indistinguishable from a real regression, which
          # is how it sat unnoticed. Setting NPM_TOKEN (decision D1) activates the
          # publish path on its own, with no edit here.
          publish: ${{ secrets.NPM_TOKEN != '' && 'npm run release' || '' }}
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Referenced only — never embedded.
          # See molecule-dev/docs/mvp/NPM-PUBLISH-PLAN.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
