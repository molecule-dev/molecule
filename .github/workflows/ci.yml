name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede, don't stack. This workflow had NO concurrency block at all, so every
# push started a full CI (build + playwright + the whole test suite) that ran to
# completion even once three newer commits had landed — several at once, all but
# the last of them answering a question nobody was asking any more.
#
# Only the newest commit's result is meaningful here, so cancel the older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Shared with release.yml via an IDENTICAL key, so whichever workflow runs
      # first builds and the other restores — one build per commit, not two.
      #
      # The key prefix is VERSIONED (mol-dist-v2-). Bumping it is what let the
      # manifest exist at all: actions/cache does not save on a primary-key HIT,
      # so a cache saved before the manifest was introduced kept hitting, kept
      # rebuilding everything for want of a manifest, and kept refusing to save
      # one. Bump the prefix whenever the cache's CONTENTS change shape.
      #
      # restore-keys IS used, but a prefix hit is never trusted wholesale. The
      # old comment here said a prefix match was unsafe because the blanket
      # `find … -exec touch` that followed would declare dist from a DIFFERENT
      # commit fresh. That was true of the touch, not of the restore — so the
      # touch is gone.
      #
      # scripts/dist-cache-manifest.mjs records what each package's sources
      # hashed to when its dist was built, and on restore marks fresh ONLY the
      # packages whose sources still hash identically. Everything else keeps a
      # stale-looking dist and gets rebuilt. Content check, not mtime guess.
      #
      # Without this, one changed file busts a single fleet-wide hash and all
      # ~914 packages rebuild — which is what the 5-file "version packages"
      # commit did. Now it rebuilds 5.
      - uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            packages/**/dist
            .dist-manifest.json
          key: mol-dist-v2-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'packages/**/package.json', 'packages/**/tsconfig.json') }}
          restore-keys: mol-dist-v2-${{ runner.os }}-
      # Always runs: a prefix restore sets cache-hit to false while still having
      # restored files, and the script is fail-safe — no manifest marks nothing
      # fresh, i.e. the old full-rebuild behaviour.
      - name: Reuse dist for packages whose sources are unchanged
        run: node scripts/dist-cache-manifest.mjs --apply
      - run: npm ci
      - run: npm run check:lockfile
      - run: npm run check:peer-deps
      # Guard the SEC3 security gates below from silent removal/weakening (e.g.
      # the audit level relaxed under `moderate`, or the secret scan dropped).
      - run: npm run check:security-workflow
      # Guard against HTML-entity contamination creeping back into locale data.
      - run: node scripts/decode-locale-entities.js --check
      # Every app feature package must carry a module-level @example so its
      # auto-generated MOLECULE.md shows the AI executor how to use the component.
      - run: npm run check:feature-jsdocs
      # i18n parity (cross-cutting-i18n): a literal `t('ns.key')` whose namespace
      # is owned by a single locale bond must exist in that bond's en.ts — else
      # English speakers see the inline defaultValue but every other locale is
      # stuck on English for that surface. Fails ONLY on NEW gaps vs the
      # scripts/i18n-parity-baseline.json debt list, so the historical backlog is
      # paid down without turning the gate red today.
      - run: npm run check:i18n-parity
      - run: npm run build
      # Record what each package's sources hashed to, so the NEXT run can reuse
      # this dist per-package instead of rebuilding the fleet. Written after the
      # build so it always describes output that actually exists.
      - name: Record dist manifest for the next run
        run: node scripts/dist-cache-manifest.mjs --write
      # @molecule/app-e2e-fixtures-default ships a REAL-DEPENDENCY integration
      # test that drives headless Chromium through the actual Playwright runner
      # — it is the gate proving a blank React mount cannot pass e2e green. Its
      # own docstring notes it needs Chromium installed; the runner has the npm
      # package but no browser binary, so the test failed here while passing
      # locally. Install the browser rather than skip the test: skipping would
      # mean that guard only ever runs on a developer's machine.
      - run: npx --yes playwright install --with-deps chromium
        working-directory: packages/app/features/e2e-fixtures-default
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Security scanning (SEC3) — the core @molecule/* library publishes to npm, so
  # it must carry the same secure-by-default gates mlcl ships in its own CI and
  # scaffolds into every generated project. Two independent gates:
  #   - npm audit  — fails on a moderate-or-higher dependency advisory
  #   - gitleaks   — fails if a credential is committed to the working tree
  #
  # USER ACTION (platform toggle — cannot be set from a workflow): also enable
  # GitHub-native secret scanning + push protection in the repo's
  # Settings → Code security and analysis. That blocks a known secret pattern at
  # `git push` time (before it ever lands), complementing the post-checkout
  # gitleaks scan below. https://docs.github.com/code-security/secret-scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail on a moderate-or-higher dependency advisory. Mirrors mlcl's gate —
      # do NOT relax below `moderate` to dodge findings (that hides real debt).
      #
      # Runs through audit-gate.mjs rather than bare `npm audit` so an advisory
      # with NO upstream fix can be accepted explicitly, with a reason and an
      # expiry, instead of pinning CI red forever. A permanently-red gate is the
      # failure mode this repo has already paid for (AGENTS.md Rule 23): this job
      # was red on every commit for two days over one unpatchable finding, and
      # three fleet releases published straight past it. Every other advisory
      # still fails the build; a lapsed exception fails it again on purpose.
      - run: node scripts/audit-gate.mjs
      # Working-tree secret scan via gitleaks (Docker on the runner — no
      # marketplace-action license needed). `--no-git` catches a leaked
      # credential in an open PR before it is merged.
      - name: Scan for committed secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source=/repo --no-git --redact --verbose
